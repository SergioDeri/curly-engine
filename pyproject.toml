[project]
name = "curly-engine"
version = "0.1.0"
description = "Asistente de soporte al cliente multi-agente con RAG, LangGraph y FastAPI"
authors = [
    { name = "Sergio Deri", email = "67972664+SergioDeri@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "arize-phoenix-otel>=0.17.1",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.4",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "openinference-instrumentation-langchain>=0.1.76",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
